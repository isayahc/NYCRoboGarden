name: Garden registry
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Viam test dependencies
        run: python -m pip install -r requirements-viam.txt
      - run: python -m unittest discover -s tests -v
      - name: Hardware-free Viam and camera CLI checks
        run: |
          python -m viam_integration --help
          python pi-arm4-camera/server.py --help
          python -m py_compile pi-arm4-camera/server.py
          bash -n pi-arm4-camera/tunnel.sh
      - name: Offline CLI smoke test
        run: >-
          python -m garden_registry
          --raw tests/fixtures/greenthumb.json
          --metadata tests/fixtures/metadata.json
          --retrieved-at 2026-10-23T00:00:00Z
          --output data/generated/ci
  oi-scene-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: garden
      - uses: actions/checkout@v4
        with:
          repository: Mapped-Assembly/Open-Industries
          ref: acfcdf7f10813639d9036ae2a00466209f32389d
          path: oi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: oi/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: oi
      - run: python -m pip install mcp==1.30.0
      - name: Native OI roundtrip, Tiles, and SQLite MCP restart/export
        working-directory: garden
        env:
          OI_ROOT: ${{ github.workspace }}/oi
        run: python -m unittest discover -s tests -p test_scene_adapter.py -v
      - name: OpenCode space authoring backend integration
        working-directory: garden
        env:
          OI_ROOT: ${{ github.workspace }}/oi
        run: python -m unittest discover -s tests -p test_author_space.py -v
  mounted-arm-patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-simulation.txt
      - run: python -m unittest discover -s tests -p test_garden_patrol.py -v
      - run: python -m unittest discover -s tests -p test_farm_mission.py -v
